name: personal_blog
description: "A new Flutter project."
publish_to: "blog"

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # UI & Theming
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Navigation
  go_router: ^12.1.3
  
  # Code Highlighting & Markdown
  flutter_highlight: ^0.7.0
  flutter_markdown: ^0.6.18
  markdown: ^7.1.1
  
  # Storage & Caching
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Utilities
  url_launcher: ^6.2.2
  share_plus: ^7.2.2
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/gifs/loading.gif
    - assets/gifs/programmer.gif
